spring:
  application:
    name: davinchi-tutorial-1
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 1MB
  cache:
    type: simple

logging:
  level:
    edu:
      tutorial: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: "always"
  metrics:
    distribution:
      percentiles-histogram:
        http-server:
          request: true
